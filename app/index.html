<!DOCTYPE html>
<html lang="en">
<head>
<!-- Google tag (gtag.js) -->
<script async src="https://www.googletagmanager.com/gtag/js?id=AW-18213168150"></script>
<script>
  window.dataLayer = window.dataLayer || [];
  function gtag(){dataLayer.push(arguments);}
  gtag('js', new Date());

  gtag('config', 'AW-18213168150');
</script>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>RentReady Network</title>
<meta name="theme-color" content="#1A4731" />
<!-- DM Sans is the brand typeface named in every page's font stack; load it
     once here (display=swap, so text renders immediately) so Windows and
     Android desktops get it instead of falling back to Arial. -->
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:opsz,wght@9..40,400..800&display=swap" rel="stylesheet">
<!--
  Stripe.js is loaded async so it never blocks first paint; pages that
  need it await window.rrnLoadStripeJs() (checkout-client.js), which reuses
  this tag. These two scripts were previously included with a <script src="..."> tag
  on 8 of the individual pages (checkout-client.js) and 1 page
  (js.stripe.com/v3 — used directly by rentready-review-checkout.html).
  Neither has any load-time side effects — they only define globals
  (window.rrn*, window.Stripe) for pages to call later — so loading them
  once here, before any page mounts, is behaviorally identical to how each
  page loaded them individually, and guarantees they're always ready by
  the time a page's own script runs.
-->
<link rel="preconnect" href="https://js.stripe.com" crossorigin>
<script src="https://js.stripe.com/v3/" async></script>
<script src="/assets/checkout-client.js"></script>
<!-- Funnel step tracking for the Google Sheets "Funnel" tab (no UI, no Stripe access). -->
<script src="/assets/funnel-tracker.js" defer></script>
<style>
  a[href*="netlify.com"][style*="fixed"],
  iframe[src*="netlify"],
  iframe[title*="Netlify"],
  [aria-label*="Netlify"][style*="fixed"],
  [data-netlify-badge],
  [class*="netlify-badge"],
  [id*="netlify-badge"] {
    display: none !important;
    opacity: 0 !important;
    pointer-events: none !important;
    visibility: hidden !important;
  }
</style>
</head>
<body>
<div id="root"></div>
<script type="module" src="/src/main.jsx"></script>
</body>
</html>
