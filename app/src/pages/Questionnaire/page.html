<!-- INLINE SVG SYMBOLS -->
<svg xmlns="http://www.w3.org/2000/svg" style="display:none">
  <symbol id="i-home" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M3 9.5L12 3l9 6.5V20a1 1 0 01-1 1H4a1 1 0 01-1-1z"/><path d="M9 21V12h6v9"/></symbol>
  <symbol id="i-right" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><line x1="5" y1="12" x2="19" y2="12"/><polyline points="12 5 19 12 12 19"/></symbol>
  <symbol id="i-left" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><line x1="19" y1="12" x2="5" y2="12"/><polyline points="12 19 5 12 12 5"/></symbol>
  <symbol id="i-shield" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z"/></symbol>
  <symbol id="i-check" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><polyline points="20 6 9 17 4 12"/></symbol>
  <symbol id="i-msg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M21 15a2 2 0 01-2 2H7l-4 4V5a2 2 0 012-2h14a2 2 0 012 2z"/></symbol>
</svg>

<div class="bg">
  <div class="blob blob-1"></div>
  <div class="blob blob-2"></div>
  <div class="blob blob-3"></div>
</div>

<div class="shell" data-agent-number-one>
  <div class="card agent-card">
    <div class="progress-track"><div class="progress-fill" id="agentProgress" style="width:0%"></div></div>
    <div class="card-header">
      <div class="brand">
        <div class="brand-icon"><svg style="stroke:#fff"><use href="#i-home"/></svg></div>
        RentReady <strong>Network</strong>
      </div>
      <div class="step-tag" id="agentStepTag">Agent Number One</div>
    </div>

    <main class="agent-shell" aria-live="polite">
      <section class="agent-intro">
        <div class="hero-icon agent-avatar"><svg style="stroke:#fff"><use href="#i-msg"/></svg></div>
        <div class="eyebrow">RentReady Qualification Concierge</div>
        <h1 class="title">HI I AM <strong>ARIA</strong></h1>
        <p class="subtitle">Answer one quick question at a time. Agent Number One will organize your rental profile and prepare a clean handoff for the next RentReady step.</p>
        <div class="trust">
          <div class="trust-item"><svg style="stroke:var(--green-accent)"><use href="#i-shield"/></svg> No Credit Pull</div>
          <div class="trust-item"><svg style="stroke:var(--green-accent)"><use href="#i-check"/></svg> No Approval Promise</div>
          <div class="trust-item"><svg style="stroke:var(--green-accent)"><use href="#i-check"/></svg> No Guarantee</div>
        </div>
      </section>

      <section class="agent-conversation" id="agentConversation" aria-label="Agent Number One conversation"></section>

      <form class="agent-response" id="agentForm" novalidate>
        <div id="agentResponseMount"></div>
        <div class="agent-error" id="agentError"></div>
        <div class="btn-row agent-actions">
          <button class="btn-back" type="button" id="agentBack"><svg width="14" height="14" style="stroke:currentColor"><use href="#i-left"/></svg> Back</button>
          <button class="btn-primary" type="submit" id="agentNext">Start <span class="ic"><svg width="16" height="16" style="stroke:#fff"><use href="#i-right"/></svg></span></button>
        </div>
      </form>
    </main>
  </div>
  <div class="aria-robot" aria-hidden="true">
    <div class="aria-robot-head">
      <div class="aria-robot-face">
        <span class="aria-robot-eye"></span>
        <span class="aria-robot-eye"></span>
      </div>
      <span class="aria-robot-cap"></span>
    </div>
    <div class="aria-robot-neck"></div>
    <div class="aria-robot-body">
      <span class="aria-robot-arm aria-robot-arm-left"></span>
      <span class="aria-robot-arm aria-robot-arm-right"></span>
      <span class="aria-robot-leg aria-robot-leg-left"></span>
      <span class="aria-robot-leg aria-robot-leg-right"></span>
    </div>
  </div>
</div>
