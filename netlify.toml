# RentReady on Netlify — static Vite build + one API function (/api/*) + a scheduled job,
# plus RentReady Finder (rentready-finder/) built into dist/finder/ and served at /finder with its own function.
[build]
  command = "npm run build && npm run build:finder"
  publish = "dist"
  functions = "netlify/functions"

[build.environment]
  NODE_VERSION = "22"

[context.production.environment]
  VITE_FUNNEL_MODE = "production"

[functions]
  node_bundler = "esbuild"

# Security headers and SPA routing live in public/_headers and public/_redirects (copied into dist/).
