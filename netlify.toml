[build]
  base = "."
  command = "cd app && npm install && npm run build"
  publish = "app/dist"
  functions = "netlify/functions"

[functions]
  node_bundler = "esbuild"

[[headers]]
  for = "/*.html"
  [headers.values]
    Cache-Control = "no-store, no-cache, must-revalidate"
    X-Content-Type-Options = "nosniff"
    X-Frame-Options = "SAMEORIGIN"
    Referrer-Policy = "strict-origin-when-cross-origin"

[[headers]]
  for = "/*.jpg"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"

[[headers]]
  for = "/*.png"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"

[[headers]]
  for = "/*.webp"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"

[[headers]]
  for = "/real estate images/*"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"

[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"

# --- Legacy / alternate URL aliases, preserved from the old multi-page site.
# Each now points at the equivalent client-side route (no more physical
# .html files) and 301s so the browser lands on the canonical URL, which
# then falls through to the SPA catch-all below.
[[redirects]]
  from = "/renter-lead-form.html"
  to = "/"
  status = 301

[[redirects]]
  from = "/renter-lead-form"
  to = "/"
  status = 301

