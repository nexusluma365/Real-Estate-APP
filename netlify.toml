# --- SPA fallback. MUST be the last redirect rule: any path not matched
# above (including every real route like /real-estate-list,
# /after-payment-results, etc.) gets the app shell, and React Router
# renders the right page client-side from the URL.
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200
